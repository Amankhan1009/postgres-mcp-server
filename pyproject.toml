[project]
name = "postgres-mcp-server"
version = "0.1.0"
description = "Production-grade AI PostgreSQL MCP Server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "groq>=0.13.0",
    "sqlparse>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that hit a real database (deselect with '-m \"not integration\"')",
]